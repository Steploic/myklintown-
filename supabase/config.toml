# Configuration Supabase local
# Voir https://supabase.com/docs/guides/local-development/cli/config

project_id = "myklintown"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Base locale = les migrations seules, comme la production. seed.sql (démo de
# pitch, antérieur aux migrations) n'y est pas rejoué.
[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# 3100 : l'application construite pour les tests navigateur (e2e).
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Les tests ouvrent des dizaines de sessions depuis la même adresse en quelques
# minutes : limites relevées (base locale et CI seulement).
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
